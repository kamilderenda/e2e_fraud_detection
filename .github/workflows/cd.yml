name: CD

on:
  workflow_run:
    workflows: ["CI"]
    types:
      - completed

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest

    env:
      MODEL_NAME: ${{ secrets.MODEL_NAME }}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${{ secrets.DB_NAME }}
      DB_USER: ${{ secrets.DB_USER }}
      DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
      MLFLOW_TRACKING_URI: http://mlflow:5000

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Bicep deployment
        run: |
          az login --service-principal -u ${{ secrets.AZURE_CLIENT_ID }} -p ${{ secrets.AZURE_CLIENT_SECRET }} --tenant ${{ secrets.AZURE_TENANT_ID }}
          az account set --subscription ${{ secrets.AZURE_SUBSCRIPTION_ID }}
          az deployment group create \
            --resource-group e2e_fraud \
            --template-file infrastructure/bicep/main.bicep \
            --parameters infrastructure/bicep/parameters.json \
            --parameters postgresAdminPassword=${{ secrets.DB_PASSWORD }}

      - name: Prepare MLflow storage
        run: |
          touch mlflow.db
          mkdir -p mlruns
          
      - name: Start postgres and mlflow
        run: docker compose up -d postgres mlflow
      - name: Wait for postgres and mlflow
        run: sleep 20
      - name: Verify postgres
        run: |
          docker compose exec -T postgres pg_isready \
          -U $DB_USER \
          -d $DB_NAME
      - name: Verify mlflow
        run: |
          curl --fail http://localhost:5000

      - name: Start API
        run: docker compose up -d api
      - name: Wait for API
        run: sleep 15
      - name: Verify API container
        run: |
          docker compose ps api
      - name: API smoke test
        run: |
          curl --fail http://localhost:8000/docs

      - name: Start monitoring and sender
        run: docker compose up -d monitoring sender
      - name: Wait for sender and monitoring
        run: sleep 20

      - name: Verify all containers
        run: |
          docker compose ps

      - name: Show logs if deployment failed
        if: failure()
        run: |
          docker compose logs