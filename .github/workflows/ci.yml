name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v3
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'
      - name: Build and test in docker by docker-compose
        env:
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_NAME: ${{ secrets.DB_NAME }}
          MODEL_NAME: ${{ secrets.MODEL_NAME }}
        run: |
          docker compose build tests
          docker compose run tests pytest tests/ -v
      - name: Login, build and push docker images
        run: | 
          az acr login--name e2efraudacr
          docker build -t e2e_fraudacr.azurecr.io/fraud-mlflow:latest infrastructure/docker/mlflow
          docker build -t e2efraudacr.azurecr.io/fraud-api:latest -f infrastructure/docker_azure/api/Dockerfile .
          docker build -t e2efraudacr.azurecr.io/fraud-experiment:latest -f infrastructure/docker_azure/experiment/Dockerfile .
          docker push e2efraudacr.azurecr.io/fraud-mlflow:latest
          docker push e2efraudacr.azurecr.io/fraud-api:latest
          docker push e2efraudacr.azurecr.io/fraud-experiment:latest