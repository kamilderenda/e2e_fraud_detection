services:

  # =========================
  # POSTGRES - AIRFLOW
  # =========================
  postgres-airflow:
    image: postgres:16
    container_name: postgres-airflow
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - airflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-network

  # =========================
  # POSTGRES - FRAUD APP
  # =========================
  postgres:
    image: postgres:16
    container_name: fraud_postgres
    restart: always
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-network

  # =========================
  # POSTGRES - MLFLOW
  # =========================
  postgres-mlflow:
    image: postgres:16
    container_name: postgres-mlflow
    restart: always
    ports:
      - "5434:5432"
    environment:
      POSTGRES_USER: ${MLFLOW_DB_USER}
      POSTGRES_PASSWORD: ${MLFLOW_DB_PASSWORD}
      POSTGRES_DB: ${MLFLOW_DB_NAME}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - mlflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - local-network
  # --- SCHEDULER ---
  # Airflow scheduler that runs the tasks.
  scheduler:
    image: apache/airflow:2.10.4
    container_name: airflow-scheduler
    command: scheduler
    restart: always
    ports:
      - "8081:8081"
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${POSTGRES_AIRFLOW_CONN_URI}
    volumes:
      - ./pipelines/dags:/opt/airflow/dags
      - ./include:/opt/airflow/include
      - ./logs:/opt/airflow/logs
      - /var/run/docker.sock:/var/run/docker.sock # for DockerOperator
    depends_on:
      postgres-airflow:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    networks:
      - local-network
    
  # --- AIRFLOW-INIT ---
  # This is needed to initialize the airflow, otherwise we encounter error.
  airflow-init:
    image: apache/airflow:2.10.4
    container_name: airflow-init
    command: bash -c "airflow db migrate && airflow users create --username admin --password admin --firstname admin --lastname admin --role Admin --email admin@test.pl"
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=${POSTGRES_AIRFLOW_CONN_URI}
    depends_on:
      postgres-airflow:
        condition: service_healthy
    networks:
      - local-network

volumes:
  postgres_data:
  airflow_pgdata:
  mlflow_pgdata:

networks:
  local-network:
    driver: bridge
