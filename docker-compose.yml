services:

  postgres:
    image: postgres:16
    container_name: fraud_postgres
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5

  mlflow:
    container_name: fraud_mlflow
    build:
      context: ./infrastructure/docker/mlflow
    ports:
      - "5000:5000"
    volumes:
      - ./mlruns:/mlflow/data/mlruns
      - ./mlflow.db:/mlflow/data/mlflow.db
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:5000/health')\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s

  api:
    container_name: fraud_api
    build:
      context: .
      dockerfile: infrastructure/docker/api/Dockerfile
    environment:
      MODEL_NAME: ${MODEL_NAME}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    ports:
      - "8000:8000"
    volumes:
      - ./mlruns:/mlflow/data/mlruns
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/docs"]
      interval: 10s
      timeout: 5s
      retries: 5

  experiment:
    container_name: fraud_experiment
    build:
      context: .
      dockerfile: infrastructure/docker/experiment/Dockerfile
    environment:
      MLFLOW_TRACKING_URI: http://mlflow:5000
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      PREFECT_API_URL: ${PREFECT_API_URL}
      PREFECT_API_KEY: ${PREFECT_API_KEY}
    volumes:
      - ./data:/app/data
    depends_on:
      mlflow:
        condition: service_healthy
      postgres:
        condition: service_healthy

  sender:
    container_name: fraud_sender
    build:
      context: .
      dockerfile: infrastructure/docker/sender/Dockerfile
    environment:
      API_URL: http://api:8000/predictions/predict
      MODEL_NAME: ${MODEL_NAME}
      DB_PORT: 5432
    depends_on:
      api:
        condition: service_healthy

  monitoring:
    container_name: fraud_monitoring
    build:
      context: .
      dockerfile: infrastructure/docker/monitoring/Dockerfile
    environment:
      MODEL_NAME: ${MODEL_NAME}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    volumes:
      - ./data:/app/data
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
    restart: "no"

  tests:
    container_name: fraud_tests
    build:
      context: .
      dockerfile: infrastructure/docker/tests/Dockerfile
    environment:
      MODEL_NAME: ${MODEL_NAME}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      MLFLOW_TRACKING_URI: http://mlflow:5000
    depends_on:
      postgres:
        condition: service_healthy
      mlflow:
        condition: service_healthy
      api:
        condition: service_healthy
    restart: "no"

volumes:
  postgres_data: